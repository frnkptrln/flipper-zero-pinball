name: Browser table

on: [push, pull_request]
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install ziglang==0.15.2
      - run: python scripts/build_web.py --check
      - run: node --test tests/web.test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        with:
          name: pinball-zero-browser
          path: web/
          retention-days: 14
