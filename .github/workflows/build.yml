name: Build FAP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-physics:
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run portable physics tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/physics_test.c pinball_physics.c -lm -o /tmp/pinball-physics-test
          /tmp/pinball-physics-test

  build-fap:
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    steps:
      - uses: actions/checkout@v7
      - name: Build against the latest release SDK
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build
        with:
          sdk-channel: release
      - name: Upload FAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: flipper-zero-pinball-${{ steps.build.outputs.suffix }}
          path: ${{ steps.build.outputs.fap-artifacts }}
